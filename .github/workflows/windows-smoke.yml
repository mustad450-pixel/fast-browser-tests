name: Windows smoke test (released Fast Browser)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to test (for example v1.2.2)
        required: false
        default: v1.2.2
        type: string
      release_repo:
        description: Repository that hosts the release (owner/name)
        required: false
        default: mustad450-pixel/fast-browser-releases
        type: string
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  smoke:
    name: Install and smoke-test on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || 'v1.2.2' }}
      RELEASE_REPO: ${{ github.event.inputs.release_repo || 'mustad450-pixel/fast-browser-releases' }}
      EXPECTED_CHROMIUM: '155.0.8059.12'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download installer and verify its checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://github.com/$env:RELEASE_REPO/releases/download/$env:RELEASE_TAG"
          Invoke-WebRequest -Uri "$base/Fast-Browser-Setup.exe" -OutFile installer.exe -UseBasicParsing
          Invoke-WebRequest -Uri "$base/Fast-Browser-Setup.exe.sha256.txt" -OutFile installer.sha256.txt -UseBasicParsing
          $expected = ((Get-Content installer.sha256.txt -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash installer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "expected sha256: $expected"
          "actual sha256:   $actual"
          if ($actual -ne $expected) { throw 'Installer checksum mismatch.' }

      - name: Install silently (bounded, with logs)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'installer.log'
          # No -Wait: the installer may launch Fast Browser, which would block a -Wait forever.
          $p = Start-Process -FilePath installer.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$log" -PassThru
          $deadline = (Get-Date).AddMinutes(10)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
          if (-not $p.HasExited) {
            "Installer still running after 10 minutes; stopping it."
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Installer did not finish within 10 minutes.'
          }
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
          $chrome = Join-Path $env:LOCALAPPDATA 'Fast Sector\Fast Browser\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome)) { throw "chrome.exe not found: $chrome" }
          $v = (Get-Item -LiteralPath $chrome).VersionInfo.FileVersion
          "installed chrome version: $v"
          if ($v -ne $env:EXPECTED_CHROMIUM) { throw "Expected Chromium $env:EXPECTED_CHROMIUM, got $v" }
          "CHROME_EXE=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Collect install diagnostics
        if: always()
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE 'tests\out\diag'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $log = Join-Path $env:RUNNER_TEMP 'installer.log'
          if (Test-Path -LiteralPath $log) { Copy-Item -LiteralPath $log -Destination $dest }
          $upd = Join-Path $env:LOCALAPPDATA 'Fast Sector\Fast Browser\Updater'
          if (Test-Path -LiteralPath $upd) { Copy-Item -Path (Join-Path $upd '*') -Destination $dest -Force -ErrorAction SilentlyContinue }
          Get-ChildItem -Recurse -Force $dest | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Probe browser startup (direct run)
        shell: pwsh
        continue-on-error: true
        run: |
          $diag = Join-Path $env:GITHUB_WORKSPACE 'tests\out\diag'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $exe = Join-Path $env:LOCALAPPDATA 'Fast Sector\Fast Browser\Application\chrome.exe'
          "exe exists: $(Test-Path -LiteralPath $exe)" | Out-File (Join-Path $diag 'probe.txt')
          Get-ChildItem (Split-Path $exe) -File | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 200 | Out-File (Join-Path $diag 'probe.txt') -Append
          $vp = Start-Process -FilePath $exe -ArgumentList '--version' -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $diag 'probe-version.txt') -RedirectStandardError (Join-Path $diag 'probe-version-err.txt')
          if (-not $vp.WaitForExit(30000)) { Stop-Process -Id $vp.Id -Force -ErrorAction SilentlyContinue; "version: timed out after 30s" | Out-File (Join-Path $diag 'probe.txt') -Append } else { "version exit=$($vp.ExitCode)" | Out-File (Join-Path $diag 'probe.txt') -Append }
          $dp = Start-Process -FilePath $exe -ArgumentList '--headless=new','--disable-gpu','--no-first-run','--user-data-dir=' + (Join-Path $env:RUNNER_TEMP 'probe-profile'),'--dump-dom','about:blank' -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $diag 'probe-dom.txt') -RedirectStandardError (Join-Path $diag 'probe-err.txt')
          if (-not $dp.WaitForExit(60000)) { Stop-Process -Id $dp.Id -Force -ErrorAction SilentlyContinue; "dump-dom: timed out after 60s (killed)" | Out-File (Join-Path $diag 'probe.txt') -Append } else { "dump-dom exit=$($dp.ExitCode)" | Out-File (Join-Path $diag 'probe.txt') -Append }
          Stop-Process -Name chrome -Force -ErrorAction SilentlyContinue

      - name: Start browser with remote debugging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Join-Path $env:RUNNER_TEMP 'fb-profile'
          $args = @(
            '--remote-debugging-port=9222',
            "--user-data-dir=$profile",
            '--no-first-run',
            '--no-default-browser-check',
            '--headless=new',
            '--disable-gpu',
            'about:blank'
          )
          $diag = Join-Path $env:GITHUB_WORKSPACE 'tests\out\diag'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $p = Start-Process -FilePath $env:CHROME_EXE -ArgumentList $args -PassThru -RedirectStandardError (Join-Path $diag 'chrome-stderr.txt') -RedirectStandardOutput (Join-Path $diag 'chrome-stdout.txt')
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $null = Invoke-WebRequest -Uri 'http://127.0.0.1:9222/json/version' -UseBasicParsing; $ok = $true } catch {}
          }
          if (-not $ok) {
            "browser process hasExited=$($p.HasExited) exitCode=$(if ($p.HasExited) { $p.ExitCode } else { 'running' })" | Out-File (Join-Path $diag 'status.txt')
            try {
              Get-WinEvent -LogName Application -MaxEvents 200 -ErrorAction Stop |
                Where-Object { $_.Message -match 'chrome|Fast|Krozer|Windows Error Reporting' } |
                Select-Object -First 30 TimeCreated, Id, ProviderName, Message |
                Format-List | Out-File (Join-Path $diag 'events.txt')
            } catch { "event log read failed: $_" | Out-File (Join-Path $diag 'events.txt') }
            Get-Process -Name chrome -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, StartTime | Out-File (Join-Path $diag 'processes.txt')
            Stop-Process -Name chrome -Force -ErrorAction SilentlyContinue
            throw 'Remote debugging port did not open.'
          }
          (Invoke-WebRequest -Uri 'http://127.0.0.1:9222/json/version' -UseBasicParsing).Content

      - name: Run New Tab smoke tests
        working-directory: tests
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          node newtab-smoke.js

      - name: Run native feature checks
        working-directory: tests
        env:
          PROFILE_DIR: ${{ runner.temp }}\fb-profile
        shell: pwsh
        run: |
          node native-smoke.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ env.RELEASE_TAG }}
          path: tests/out/
          if-no-files-found: warn
